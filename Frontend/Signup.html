<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Shafeeq Pansaar Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/Signup.css">
    <style>
        .password-container { position: relative; display: flex; align-items: center; }
        .password-container input { width: 100%; padding-right: 40px; }
        .toggle-password { position: absolute; right: 10px; cursor: pointer; color: var(--text-muted); }
        .step { display: none; }
        .step.active { display: block; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .step-dot { width: 30px; height: 30px; border-radius: 50%; background: #e2e8f0; color: #64748b; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .step-dot.active { background: var(--primary-color); color: white; }
        .d-flex-between { display: flex; justify-content: space-between; gap: 10px; }
    </style>
</head>
<body>
    <button id="themeToggle" style="position:absolute; top:20px; right:20px; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:50%; cursor:pointer; width:45px; height:45px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md); z-index:100;" title="Toggle Dark Mode"><i class="fas fa-moon"></i></button>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join Shafeeq Pansaar Store for premium groceries</p>
            </div>
            
            <div class="step-indicator">
                <div class="step-dot active" id="dot1">1</div>
                <div class="step-dot" id="dot2">2</div>
                <div class="step-dot" id="dot3">3</div>
            </div>

            <form id="signupForm">
                <!-- STEP 1 -->
                <div class="step active" id="step1">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="Auto-calculated age" readonly required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" placeholder="Enter your address" style="width:100%; padding:0.8rem; border-radius:12px; border:1px solid var(--border-color); font-family:inherit; font-size:0.95rem; background:#f9fafb;" required></textarea>
                    </div>
                    <button type="button" class="auth-btn w-100" style="width: 100%;" onclick="nextStep(1)">Next <i class="fas fa-arrow-right"></i></button>
                </div>

                <!-- STEP 2 -->
                <div class="step" id="step2">
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" placeholder="e.g. +923001234567 or 03001234567" required>
                        <small style="color:var(--text-muted);">Must start with +92 or 03 and be 11 or 13 chars long.</small>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="d-flex-between">
                        <button type="button" class="auth-btn" style="flex:1; background:#64748b;" onclick="prevStep(2)"><i class="fas fa-arrow-left"></i> Back</button>
                        <button type="button" class="auth-btn" style="flex:1;" onclick="nextStep(2)">Next <i class="fas fa-arrow-right"></i></button>
                    </div>
                </div>

                <!-- STEP 3 -->
                <div class="step" id="step3">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-container">
                            <input type="password" id="password" placeholder="Create a password" required>
                            <i class="fas fa-eye toggle-password" id="togglePassword1"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-container">
                            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                            <i class="fas fa-eye toggle-password" id="togglePassword2"></i>
                        </div>
                    </div>
                    <div class="d-flex-between">
                        <button type="button" class="auth-btn" style="flex:1; background:#64748b;" onclick="prevStep(3)"><i class="fas fa-arrow-left"></i> Back</button>
                        <button type="submit" class="auth-btn" style="flex:1;">Sign Up</button>
                    </div>
                </div>
            </form>
            <div class="auth-footer">
                <p>Already have an account? <a href="Login.html">Login here</a></p>
            </div>
        </div>
    </div>
    <script src="assets/js/Signup.js"></script>
</body>
</html>
