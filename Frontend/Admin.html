<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Shafeeq Pansaar Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/Admin.css">
</head>
<body>
    <a href="Intro.html" style="position:absolute; top:20px; left:20px; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:50%; cursor:pointer; width:45px; height:45px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md); z-index:100; text-decoration:none;" title="Go Back"><i class="fas fa-arrow-left"></i></a>
    <button id="themeToggle" style="position:absolute; top:20px; right:20px; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:50%; cursor:pointer; width:45px; height:45px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md); z-index:100;" title="Toggle Dark Mode"><i class="fas fa-moon"></i></button>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Admin Portal</h2>
                <p>Login to manage Shafeeq Pansaar Store</p>
            </div>
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Enter admin password" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>
                <button type="submit" class="auth-btn w-100" style="width: 100%;">Login as Admin</button>
            </form>
            <div class="auth-footer" style="margin-top: 15px; text-align: center;">
                <p><a href="#" onclick="openForgotPasswordModal(event)" style="color: var(--primary-color);">Forgot Password?</a></p>
                <p style="margin-top: 10px;"><a href="Home.html">Return to Storefront</a></p>
            </div>
        </div>
    </div>

    <!-- Admin Forgot Password Modal -->
    <div class="modal-overlay" id="forgotPasswordModal">
        <div class="modal" style="max-width: 400px; padding: 20px;">
            <div class="modal-header">
                <h3>Reset Admin Password</h3>
                <button class="close-btn" onclick="closeForgotPasswordModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="resetUsername" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label>Secret Master Key</label>
                    <input type="password" id="resetSecretKey" placeholder="Enter secret master key">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="resetNewPassword" placeholder="Enter new password">
                </div>
                <button class="auth-btn w-100" style="width: 100%;" onclick="submitForgotPassword()">Reset Password</button>
            </div>
        </div>
    </div>
    <script src="assets/js/Admin.js"></script>
</body>
</html>
