<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shafeeq Pansaar Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/Login.css">
    <style>
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input {
            width: 100%;
            padding-right: 40px; /* space for icon */
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            cursor: pointer;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <a href="Intro.html" style="position:absolute; top:20px; left:20px; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:50%; cursor:pointer; width:45px; height:45px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md); z-index:100; text-decoration:none;" title="Go Back"><i class="fas fa-arrow-left"></i></a>
    <button id="themeToggle" style="position:absolute; top:20px; right:20px; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-main); padding:10px; border-radius:50%; cursor:pointer; width:45px; height:45px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md); z-index:100;" title="Toggle Dark Mode"><i class="fas fa-moon"></i></button>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Login to your Shafeeq Pansaar Store account</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>
                <button type="submit" class="auth-btn w-100" style="width: 100%;">Login</button>
            </form>
            <div class="auth-footer" style="margin-top: 15px; text-align: center;">
                <p><a href="#" onclick="openForgotPasswordModal(event)" style="color: var(--primary-color);">Forgot Password?</a></p>
                <p style="margin-top: 10px;">Don't have an account? <a href="Signup.html">Sign up here</a></p>
            </div>
        </div>
    </div>

    <!-- User Forgot Password Modal -->
    <div class="modal-overlay" id="forgotPasswordModal">
        <div class="modal" style="max-width: 400px; padding: 20px;">
            <div class="modal-header">
                <h3>Reset Password</h3>
                <button class="close-btn" onclick="closeForgotPasswordModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="resetEmail" placeholder="Enter your registered email">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="resetPhone" placeholder="Enter your registered phone">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="resetNewPassword" placeholder="Enter new password">
                </div>
                <button class="auth-btn w-100" style="width: 100%;" onclick="submitForgotPassword()">Reset Password</button>
            </div>
        </div>
    </div>
    <script src="assets/js/Login.js"></script>
</body>
</html>
